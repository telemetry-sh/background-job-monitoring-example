[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-background-job-example"
version = "1.0.0"
description = "A background job monitoring example for Telemetry.sh"
requires-python = ">=3.11"
dependencies = ["telemetry-sh>=1.0.9,<2"]

[tool.setuptools]
packages = ["job_monitor"]
